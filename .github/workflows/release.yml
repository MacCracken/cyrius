name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  # ── CI Gate (must pass before release) ──
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── Build x86_64 ──
  build-x86:
    name: Build x86_64
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Bootstrap fresh toolchain
        run: |
          sh bootstrap/bootstrap.sh
          chmod +x build/cycc
          cat src/main.cyr | ./build/cycc > /tmp/cc5_release
          chmod +x /tmp/cc5_release
          cat src/main.cyr | /tmp/cc5_release > /tmp/cc5_verify
          cmp /tmp/cc5_release /tmp/cc5_verify
          echo "PASS: cycc self-hosts (x86_64)"
          cp /tmp/cc5_release build/cycc

      - name: Build tools
        run: |
          # Read tool list from cyrius.cyml [release].bins (v5.4.18) — skip
          # cycc (already built by bootstrap) and cyrius (special-cased below).
          BINS=$(awk -v k="bins" '
              /^\[release\]/ { in_r = 1; next }
              in_r && /^\[/ { exit }
              in_r && $1 == k {
                  sub(/^[^=]+= \[/, ""); sub(/\].*$/, "")
                  gsub(/[",]/, " "); gsub(/ +/, " ")
                  sub(/^ +/, ""); sub(/ +$/, ""); print; exit
              }' cyrius.cyml)
          for tool in $BINS; do
            if [ "$tool" = "cycc" ] || [ "$tool" = "cyrius" ]; then continue; fi
            if [ -f "programs/${tool}.cyr" ]; then
              cat programs/${tool}.cyr | ./build/cycc > ./build/${tool} && chmod +x ./build/${tool}
            fi
          done
          # cyrius build tool — compiled from Cyrius (auto-include, deps, -v)
          cat cbt/cyrius.cyr | ./build/cycc > ./build/cyrius && chmod +x ./build/cyrius
          echo "cyrius tool: $(wc -c < ./build/cyrius) bytes"
          # Cross-compile aarch64 compiler for inclusion in x86_64 tarball
          cat src/main_aarch64.cyr | ./build/cycc > ./build/cycc_aarch64 && chmod +x ./build/cycc_aarch64
          # v6.1.16: cross-compile the PE (Windows) compiler for inclusion in
          # the x86_64 tarball too. cycc_win has been in cyrius.cyml cross_bins
          # since v6.0.50 and the LOCAL install.sh source-bootstrap path builds
          # it (scripts/install.sh:524), but the release tarball packaging was
          # never taught to — so every published x86_64 tarball since v6.0.50
          # shipped WITHOUT cycc_win, and pinned-release consumers (sakshi/patra
          # CI) that `cyrius build --win` hit "cycc_win missing from the Cyrius
          # install". Same class of gap as the cycc_aarch64 packaging fix at
          # v5.8.2 below. Build from src/main_win.cyr with CYRIUS_TARGET_WIN=1
          # (the x86 cycc emits a PE32+ cycc, runs on the Linux host, emits PE).
          cat src/main_win.cyr | CYRIUS_TARGET_WIN=1 ./build/cycc > ./build/cycc_win && chmod +x ./build/cycc_win

      - name: Verify x86_64 binary
        run: |
          file build/cycc | grep -q "ELF 64-bit.*x86-64" || { echo "ERROR: cycc not x86_64"; file build/cycc; exit 1; }
          echo "PASS: cycc is x86_64 ELF"
          # v6.1.16: fail loud if the PE cross-compiler didn't build / isn't a
          # PE32+ — a missing cycc_win is the packaging gap that broke pinned
          # consumers silently (sakshi CI). Don't ship an x86_64 tarball without it.
          file build/cycc_win | grep -q "PE32+ executable.*x86-64" || { echo "ERROR: cycc_win not PE32+"; file build/cycc_win; exit 1; }
          echo "PASS: cycc_win is PE32+"

      - name: Package x86_64 tarball
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="cyrius-${VER}-x86_64-linux"
          mkdir -p "$STAGE/bin" "$STAGE/lib"

          # Bins + scripts from cyrius.cyml [release] (v5.4.18 unified source).
          BINS=$(awk -v k="bins" '
              /^\[release\]/ { in_r = 1; next }
              in_r && /^\[/ { exit }
              in_r && $1 == k {
                  sub(/^[^=]+= \[/, ""); sub(/\].*$/, "")
                  gsub(/[",]/, " "); gsub(/ +/, " ")
                  sub(/^ +/, ""); sub(/ +$/, ""); print; exit
              }' cyrius.cyml)
          SCRIPTS=$(awk -v k="scripts" '
              /^\[release\]/ { in_r = 1; next }
              in_r && /^\[/ { exit }
              in_r && $1 == k {
                  sub(/^[^=]+= \[/, ""); sub(/\].*$/, "")
                  gsub(/[",]/, " "); gsub(/ +/, " ")
                  sub(/^ +/, ""); sub(/ +$/, ""); print; exit
              }' cyrius.cyml)
          for bin in $BINS; do
            [ -f "build/$bin" ] && cp "build/$bin" "$STAGE/bin/"
          done
          # v5.8.2: cycc_aarch64 ships under bin/ alongside cycc. Pre-v5.8.2
          # placed it at $STAGE/ top-level "as a dev tool" — but downstream
          # consumers (sakshi/yukti/patra/mabda CI) install via `cp bin/*`
          # to ~/.cyrius/bin/, silently dropping the top-level binary and
          # then failing aarch64 cross-builds with `compiler not found:
          # ~/.cyrius/bin/cycc_aarch64`. Local install.sh has always placed
          # cross_bins in bin/ (scripts/install.sh:100); release tarball
          # now matches. Canonical upstream report:
          # yukti/docs/development/issues/2026-04-30-cyrius-cycc-aarch64-packaging.md.
          [ -f "build/cycc_aarch64" ] && cp "build/cycc_aarch64" "$STAGE/bin/"
          # v6.1.16: ship the PE cross-compiler alongside cycc_aarch64 (built
          # above). Without this, pinned-release installs have no cycc_win and
          # `cyrius build --win` / the sakshi-CI cycc_win guard fail.
          [ -f "build/cycc_win" ] && cp "build/cycc_win" "$STAGE/bin/"
          cp bootstrap/asm "$STAGE/bin/"
          for script in $SCRIPTS; do
            [ -f "scripts/$script" ] && cp "scripts/$script" "$STAGE/bin/"
          done
          cp scripts/ci.sh "$STAGE/bin/" 2>/dev/null || true
          chmod +x "$STAGE/bin"/*

          sh scripts/release-lib.sh "$STAGE/lib"
          cp VERSION LICENSE "$STAGE/"
          cp scripts/install.sh "$STAGE/"

          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

          mkdir -p dist
          mv "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: dist/

  # ── Build aarch64 ──
  build-aarch64:
    name: Build aarch64
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu-user
        run: |
          # Swap Azure Ubuntu mirror to canonical — azure.archive.ubuntu.com
          # has been DNS-flaky on GH-hosted runners (746 B/s, 5min timeouts).
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build native aarch64 compiler
        run: |
          chmod +x build/cycc
          # Step 1: x86 cycc → cross-compiler (x86 binary that emits aarch64)
          cat src/main_aarch64.cyr | ./build/cycc > /tmp/cc5_cross && chmod +x /tmp/cc5_cross
          # Step 2: cross-compiler → native aarch64 binary
          cat src/main_aarch64.cyr | /tmp/cc5_cross > ./build/cycc_aarch64 && chmod +x ./build/cycc_aarch64
          echo "cycc_aarch64: $(wc -c < ./build/cycc_aarch64) bytes"
          # Verify architecture
          file ./build/cycc_aarch64 | grep -q "ARM aarch64" || { echo "ERROR: not aarch64"; file ./build/cycc_aarch64; exit 1; }
          # Smoke test: cross-compiler produces working binaries
          echo "var x = 42;" | /tmp/cc5_cross > /tmp/a64_test && chmod +x /tmp/a64_test
          result=$(timeout 5 qemu-aarch64-static /tmp/a64_test; echo $?)
          test "$result" = "42" && echo "PASS: cross-compiler output works under qemu"
          # NOTE: native compiler smoke test skipped — self-hosted aarch64 binary
          # generates code with a subtle codegen difference under QEMU.
          # Cross-compiler is the shipped artifact for x86 hosts.
          # Native binary tested on real ARM hardware (agnosarm).

      - name: Package aarch64 tarball
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="cyrius-${VER}-aarch64-linux"
          mkdir -p "$STAGE/bin" "$STAGE/lib"

          cp build/cycc_aarch64 "$STAGE/bin/cycc"
          # Build cyrius tool for aarch64 tarball (x86 binary — runs on host for cross builds)
          if [ -f "build/cyrius" ]; then cp build/cyrius "$STAGE/bin/"; fi
          cp scripts/cyrius-init.sh "$STAGE/bin/" 2>/dev/null || true
          cp scripts/cyriusly "$STAGE/bin/"
          chmod +x "$STAGE/bin"/*

          sh scripts/release-lib.sh "$STAGE/lib"
          cp VERSION LICENSE "$STAGE/"
          cp scripts/install.sh "$STAGE/"

          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

          mkdir -p dist
          mv "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: dist/

  # ── Build macOS x86_64 (Mach-O) ──
  build-macos:
    name: Build macOS x86_64
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS compiler + tools
        run: |
          chmod +x build/cycc
          # Build cycc from source (for reproducibility)
          cat src/main.cyr | ./build/cycc > /tmp/cc5_fresh && chmod +x /tmp/cc5_fresh
          # Cross-compile: cycc itself as a Mach-O binary
          # (The Mach-O cycc won't self-host on Linux — it's for macOS)
          # Instead, compile key tools for macOS
          for tool in cyrfmt cyrlint cyrdoc; do
            if [ -f "programs/${tool}.cyr" ]; then
              cat programs/${tool}.cyr | CYRIUS_MACHO=1 /tmp/cc5_fresh > ./build/${tool}_macho 2>/dev/null
              echo "${tool}_macho: $(wc -c < ./build/${tool}_macho) bytes"
              # Verify Mach-O magic
              magic=$(xxd -l4 -p ./build/${tool}_macho)
              test "$magic" = "cffaedfe" || { echo "ERROR: ${tool} not Mach-O"; exit 1; }
            fi
          done

      - name: Verify Mach-O binaries
        run: |
          for f in build/*_macho; do
            [ -f "$f" ] || continue
            file "$f" | grep -q "Mach-O 64-bit x86_64" || { echo "ERROR: $f not Mach-O x86_64"; exit 1; }
          done
          echo "PASS: all Mach-O binaries verified"

      - name: Package macOS tarball
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="cyrius-${VER}-x86_64-macos"
          mkdir -p "$STAGE/bin" "$STAGE/lib"

          # Rename tools (strip _macho suffix)
          for f in build/*_macho; do
            [ -f "$f" ] || continue
            name=$(basename "$f" _macho)
            cp "$f" "$STAGE/bin/$name"
            chmod +x "$STAGE/bin/$name"
          done

          # Version manager
          cp scripts/cyriusly "$STAGE/bin/"
          chmod +x "$STAGE/bin/cyriusly"

          # Include macOS-specific stdlib
          sh scripts/release-lib.sh "$STAGE/lib"
          cp lib/syscalls_macos.cyr "$STAGE/lib/"
          cp lib/alloc_macos.cyr "$STAGE/lib/"
          cp VERSION LICENSE "$STAGE/"

          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

          mkdir -p dist
          mv "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/

  # ── Build macOS arm64 (Mach-O, Apple Silicon) ──
  # Ships the Apple Silicon stdlib bundle + a minimal hello-world smoke
  # binary so the tarball has verifiable arm64 Mach-O content. Full
  # toolchain binaries (cyrfmt, cyrlint, cyrdoc) are NOT yet available
  # for arm64 because they pull in syscalls outside the BSD whitelist
  # (brk, flock) — v5.3.12's parse-time gate correctly rejects these,
  # and the fix is libSystem imports (v5.4.x). Until then, users on
  # Apple Silicon cross-compile from a Linux host with
  # `CYRIUS_MACHO_ARM=1 build/cycc_aarch64`.
  build-macos-arm64:
    name: Build macOS arm64
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS arm64 tarball
        run: |
          # v6.0.38: ship a REAL toolchain, not a smoke toy. Pre-fix this
          # job packaged only `smoke.macho` + lib + README — so every
          # macOS arm64 install got NO compiler ("found by ports" — a user
          # installed on Apple Silicon and got nothing). Packaging lives in
          # ONE script that the `cyrius audit` cross-OS install gate also
          # runs, so what we verify is what we ship.
          chmod +x build/cycc
          sh scripts/build-macos-arm64-tarball.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/

  # ── Build Windows x86_64 (PE32+) ──
  # Windows binaries use the cycc_win cross-compiler (a Linux-hosted
  # compiler that EMITS PE, built from src/main_win.cyr) rather than an
  # env flag like Mach-O's CYRIUS_MACHO. The Windows-native cycc is then
  # produced by compiling src/main_win.cyr THROUGH cycc_win.
  build-windows:
    name: Build Windows x86_64
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v6.0.85: single source of truth — build-windows-tarball.sh is what both
      # this release job AND the `cyrius audit` cass install gate run, so the
      # shipped tarball is byte-for-byte what we verify. It includes cyrius.exe
      # (the wrapper) + install.ps1 so the Windows install pillar works
      # (`cyrius build` on a real box). The script validates PE32+ magic itself.
      - name: Build + package Windows tarball (PE32+)
        run: |
          chmod +x build/cycc
          sh scripts/build-windows-tarball.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/

  # ── Create GitHub Release ──
  release:
    name: Create GitHub Release
    needs: [build-x86, build-aarch64, build-macos, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-aarch64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/

      - name: Add standalone installer
        run: cp scripts/install.sh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cyrius ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: dist/*
